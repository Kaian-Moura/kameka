<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Poupazenda</title>
    <style>
      /* Reset e configurações base - Mobile First */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        touch-action: none;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Arial, sans-serif;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      #game-container canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }

      /* Landscape otimization for mobile */
      @media screen and (orientation: landscape) and (max-height: 500px) {
        #game-container {
          height: 100vh;
        }
      }

      /* Tablet e Desktop - Progressivo */
      @media screen and (min-width: 768px) {
        #game-container {
          max-width: 768px;
          max-height: 1024px;
          box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
      }

      @media screen and (min-width: 1024px) {
        #game-container {
          max-width: 414px;
          max-height: 896px;
        }
      }

      /* Loading indicator */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="loading">Carregando...</div>
    </div>

    <!-- Phaser via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- Scripts do jogo -->
    <script type="module">
      // Define o caminho base dos assets
      window.ASSETS_PATH = window.location.pathname.includes("/kameka/")
        ? "/kameka/assets/"
        : "./assets/";

      console.log("📁 Assets path:", window.ASSETS_PATH);

      // Importa as cenas
      import SplashScene from "./src/scenes/SplashScene.js";
      import GameScene from "./src/scenes/GameScene.js";
      import ShopScene from "./src/scenes/ShopScene.js";
      import ChatScene from "./src/scenes/ChatScene.js";

      console.log("🚀 Iniciando PoupaZenda...");
      console.log("📦 Phaser version:", Phaser.VERSION);

      // Configuração principal do Phaser
      const config = {
        type: Phaser.AUTO,
        width: 414,
        height: 896,
        parent: "game-container",
        backgroundColor: "#87CEEB",
        scene: [SplashScene, GameScene, ShopScene, ChatScene],
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          orientation: Phaser.Scale.PORTRAIT,
        },
        dom: {
          createContainer: true,
        },
        input: {
          activePointers: 3,
        },
        render: {
          pixelArt: false,
          antialias: true,
        },
      };

      // Inicializa o jogo
      const game = new Phaser.Game(config);

      // Remove loading indicator
      game.events.once("ready", () => {
        const loading = document.querySelector(".loading");
        if (loading) {
          loading.style.display = "none";
        }
        console.log("🎮 Jogo iniciado com sucesso!");
      });

      // Fallback
      setTimeout(() => {
        const loading = document.querySelector(".loading");
        if (loading && loading.style.display !== "none") {
          loading.style.display = "none";
          console.log("⚠️ Loading removido por timeout");
        }
      }, 2000);
    </script>
  </body>
</html>
